name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /margem/
      - name: Enable GitHub Pages (Actions source)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          hdr=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/pages-post.json -w "%{http_code}" -X POST "${hdr[@]}" "$api" -d '{"build_type":"workflow"}')
          echo "POST /pages -> ${code}"
          if [ "$code" != "201" ]; then
            cat /tmp/pages-post.json
            echo
          fi
          if [ "$code" = "409" ] || [ "$code" = "422" ]; then
            code2=$(curl -sS -o /tmp/pages-put.json -w "%{http_code}" -X PUT "${hdr[@]}" "$api" -d '{"build_type":"workflow"}')
            echo "PUT /pages -> ${code2}"
            if [ "$code2" != "200" ] && [ "$code2" != "204" ]; then
              cat /tmp/pages-put.json
              echo
            fi
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
